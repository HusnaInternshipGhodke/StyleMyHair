<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>StyleMyHair | Saved Reels</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f4f6;
            color: #222;
        }

        header {
            height: 70px;

            display: flex;
            align-items: center;

            padding: 0 25px;

            background: white;

            border-bottom: 1px solid #eee;

            position: sticky;
            top: 0;

            z-index: 10;
        }

        header a {
            text-decoration: none;

            color: #222;

            font-size: 26px;

            margin-right: 20px;
        }

        header h1 {
            margin: 0;

            font-size: 22px;
        }

        .saved-container {
            width: min(1100px, 92%);

            margin: 35px auto;
        }

        .saved-container h2 {
            margin-bottom: 25px;
        }

        .saved-grid {
            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(280px, 1fr));

            gap: 25px;
        }

        .saved-card {
            background: white;

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.08);
        }

        .saved-card video {
            width: 100%;

            height: 360px;

            object-fit: cover;

            display: block;

            background: #111;
        }

        .saved-content {
            padding: 18px;
        }

        .saved-content h3 {
            margin: 0 0 8px;
        }

        .saved-content p {
            color: #666;

            line-height: 1.5;

            font-size: 14px;
        }

        .remove-button {
            width: 100%;

            border: none;

            background: #ed6fa8;

            color: white;

            padding: 11px;

            border-radius: 10px;

            cursor: pointer;

            font-weight: 600;
        }

        .empty {
            text-align: center;

            padding: 100px 20px;

            color: #777;
        }

        .empty h2 {
            color: #333;
        }

    </style>

</head>


<body>


<header>

    <a href="{{ url_for('main.female') }}">
        ←
    </a>

    <h1>
        StyleMyHair — Saved Reels
    </h1>

</header>


<div class="saved-container">

    <h2>
        Your Saved Reels
    </h2>

    <div
        class="saved-grid"
        id="savedGrid"
    ></div>

</div>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const grid =
            document.getElementById(
                "savedGrid"
            );


        function getSaved() {

            try {

                return JSON.parse(
                    localStorage.getItem(
                        "stylemyhair-saved-reels"
                    ) || "[]"
                );

            } catch (error) {

                return [];

            }

        }


        function render() {

            const saved =
                getSaved();

            grid.innerHTML = "";


            if (saved.length === 0) {

                grid.innerHTML = `

                    <div class="empty">

                        <h2>
                            No saved reels yet
                        </h2>

                        <p>
                            Go to Reels and tap
                            the 🔖 Save button.
                        </p>

                    </div>

                `;

                return;

            }


            saved.forEach(
                function (item) {

                    const card =
                        document.createElement(
                            "article"
                        );

                    card.className =
                        "saved-card";


                    card.innerHTML = `

                        <video
                            src="${item.video}"
                            controls
                            playsinline
                        ></video>

                        <div class="saved-content">

                            <h3>
                                ${escapeHTML(item.title)}
                            </h3>

                            <p>
                                ${escapeHTML(item.description)}
                            </p>

                            <button
                                class="remove-button"
                                data-id="${item.id}"
                            >
                                Remove from Saved
                            </button>

                        </div>

                    `;


                    grid.appendChild(card);

                }
            );


            document
                .querySelectorAll(
                    ".remove-button"
                )
                .forEach(
                    function (button) {

                        button.addEventListener(
                            "click",
                            function () {

                                let saved =
                                    getSaved();

                                saved =
                                    saved.filter(
                                        function (item) {

                                            return (
                                                item.id !==
                                                button.dataset.id
                                            );

                                        }
                                    );

                                localStorage.setItem(
                                    "stylemyhair-saved-reels",
                                    JSON.stringify(
                                        saved
                                    )
                                );

                                render();

                            }
                        );

                    }
                );

        }


        function escapeHTML(text) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                text;

            return div.innerHTML;

        }


        render();

    }
);

</script>


</body>
</html>
